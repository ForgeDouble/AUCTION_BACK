server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: prod

  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3s

    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: AuctionHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend:
    url: ${APP_FRONTEND_URL:https://auctionbid.shop}

jwt:
  secretKeyRT: ${JWT_SECRET_KEY_RT}
  expirationRT: ${JWT_EXPIRATION_RT:7200000}

firebase:
  service-account-b64: ${FIREBASE_SERVICE_ACCOUNT_B64:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_BUCKET_NAME}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

opensearch:
  host: ${OPENSEARCH_HOST}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  index:
    product: ${OPENSEARCH_PRODUCT_INDEX:auction_product}

cache:
  product-count-ttl-seconds: ${CACHE_PRODUCT_COUNT_TTL_SECONDS:10}

support:
  inquirer:
    email: ${SUPPORT_INQUIRER_EMAIL:}