server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      # docker으로 mongodb 생성 root 이용으로 인해 authSource => admin 적합
      # username : root , password 1234
      # docker 명 : mongo_auction / 스키마 명 : auction
      # mongodb://아이디:비번@호스트:포트/DB?authSource=인증DB
      uri: mongodb://root:1234@mongo_auction:27017/auction?authSource=admin
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/auction
    username: root
    password: 1234

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      format_sql: false
      ddl-auto: update
    show-sql: true

jwt:
  secretKeyRT: mySuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSuperSecretKey
  expirationRT: 3600000

logging:
  level:
    root: INFO
    org.springframework: WARN

firebase:
  service-account-B64: ${FIREBASE_SERVICE_ACCOUNT_B64:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
crypto:
  aes-gcm-key-b64: ${AES_GCM_KEY_B64:}
  aes-gcm-key-file: ${AES_GCM_KEY_FILE:}

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      # 후 추가 예정
      bucket: ${AWS_BUCKET_NAME:}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}

storage:
  # 이미지 최대 크기 (MB)
  max-image-mb: 10
  # 공개 URL 베이스 -> 입력 안하는 경우 S3 기본 URL 셋팅
  # 후 클라우드 프론트 배포 후 설정
  public-base-url: ""
  # 허용 타입
  allowed-mime: image/jpeg,image/png,image/webp,image/gif