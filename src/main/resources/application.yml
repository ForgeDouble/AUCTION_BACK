server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    root: INFO
    org.springframework: WARN

storage:
  max-image-mb: 10
  max-images-per-product: 10
  allowed-mime: image/jpeg,image/png,image/webp,image/gif

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      enabled: true
    tags:
      application: auction-back
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,3s