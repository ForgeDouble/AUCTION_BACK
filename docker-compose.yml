version: "3.9"
services:
  mongo_auction:
    image: mongo:7
    container_name: mongo_auction
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234
      MONGO_INITDB_DATABASE: auction
    command: ["--auth"]
    volumes:
      - mongo_auction_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - auction-net

  rabbitmq_auction:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_auction
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: auction_user
      RABBITMQ_DEFAULT_PASS: auction_pass
    networks:
      - auction-net
volumes:
  mongo_auction_data:

networks:
  auction-net:
